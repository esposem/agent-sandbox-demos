apiVersion: agents.x-k8s.io/v1beta1
kind: Sandbox
metadata:
  name: jupyter-notebook
  namespace: default
spec:
  service: true
  podTemplate:
    metadata:
      labels:
        sandbox: jupyter-notebook
    spec:
      runtimeClassName: kata-remote
      initContainers:
        - name: git-clone
          image: quay.io/confidential-devhub/signed/git:latest
          env:
          - name: BRANCH_NAME
            value: "coco_workshop_aro"
          workingDir: /home/jovyan
          command: ["/bin/sh", "-c"]
          args:
          - "cd /home/jovyan && git clone https://github.com/confidential-devhub/fraud-detection-on-cvms.git && cd fraud-detection-on-cvms && git checkout $BRANCH_NAME"
          volumeMounts:
          - name: repo-storage
            mountPath: /home/jovyan
      containers:
        - name: jupyter
          image: quay.io/confidential-devhub/signed/base-notebook:latest
          imagePullPolicy: IfNotPresent
          args:
            - start-notebook.sh
            - "--ServerApp.base_url=/"
            - "--ServerApp.port=8888"
            - "--ServerApp.token=aro_workshop123"
            - "--ServerApp.allow_origin=*"
          env:
            - name: JUPYTER_ENABLE_LAB
              value: "yes"
          volumeMounts:
            - name: repo-storage
              mountPath: /home/jovyan
            - name: azure-secret
              mountPath: "/sealed/azure-value"
            - name: dataset-key
              mountPath: "/sealed/decryption"
          ports:
            - containerPort: 8888
              name: http
          readinessProbe:
            httpGet:
              path: /api
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /api
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            # runAsUser: 1000
            # runAsGroup: 100
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: repo-storage
          emptyDir: {}
        - name: azure-secret
          emptyDir: {}
        - name: dataset-key
          emptyDir: {}