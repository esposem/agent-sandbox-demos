apiVersion: extensions.agents.x-k8s.io/v1alpha1
kind: SandboxTemplate
metadata:
  name: kata-python-template
spec:
  podTemplate:
    spec:
      runtimeClassName: kata
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
      containers:
      - name: python
        image: python:3.11-slim
        command:
        - python
        - -c
        - |
          from http.server import HTTPServer, BaseHTTPRequestHandler
          import json
          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  self.send_response(200)
                  self.send_header('Content-type', 'application/json')
                  self.end_headers()
                  self.wfile.write(json.dumps({'status': 'ready', 'pool': 'kata-warm'}).encode())
          print('Warm pool sandbox ready on port 8888...')
          HTTPServer(('0.0.0.0', 8888), Handler).serve_forever()
        ports:
        - containerPort: 8888
